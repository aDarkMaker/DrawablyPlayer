name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # Pin the wails3 CLI version (DMG packaging and Android tasks are available since v3.0.0-beta.2)
  WAILS_VERSION: v3.0.0-beta.2
  # Keep the media player frontend bundle from running out of memory
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  release-please:
    name: Bump version & create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
      - name: Install Android platform / build-tools / NDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build fat APK (arm64-v8a + x86_64)
        env:
          # Release-sign when ANDROID_KEYSTORE_* secrets exist, otherwise fall back to the debug keystore
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_ALIAS_PASS: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASS }}
        run: wails3 task android:package:fat
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK_FILE=$(ls bin/*.apk 2>/dev/null | head -n1)
          [ -n "$APK_FILE" ] || { echo "::error::No APK found in bin/"; exit 1; }
          gh release upload "$TAG" "$APK_FILE#DrawablyPlayer-android-universal-$VERSION.apk"

  windows:
    name: Build Windows exe + NSIS installer
    runs-on: windows-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build application
        run: wails3 task build
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { $nsis = "${env:ProgramFiles}\NSIS" }
          echo $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build NSIS installer
        run: wails3 task package
      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem bin -Filter *.exe | Select-Object -ExpandProperty FullName
          if ($files.Count -eq 0) { throw "No .exe found in bin/" }
          gh release upload $env:TAG $files

  macos:
    name: Build macOS DMG (${{ matrix.runner_label }})
    runs-on: ${{ matrix.runner }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runner_label: arm64
          - runner: macos-15-intel
            runner_label: amd64
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Package DMG
        # Unsigned / un-notarized by default; add certificate secrets here to enable notarization
        run: wails3 task darwin:package:dmg
      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DMG_FILE=$(ls bin/*.dmg 2>/dev/null | head -n1)
          [ -n "$DMG_FILE" ] || { echo "::error::No .dmg found in bin/"; exit 1; }
          gh release upload "$TAG" "$DMG_FILE#DrawablyPlayer-macos-${{ matrix.runner_label }}-$VERSION.dmg"
